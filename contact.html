<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/design.css">
</head>

<body>
<div class="grid-bg"></div>
<div class="wrap">
 
<nav>
  <div class="nav-logo">SHAUN || CV</div>
  <div class="nav-links">
    <a href="index.html">About</a>
    <a href="index.html#experience">Experience</a>
    <a href="index.html#skills">Skills</a>
    <a href="index.html#projects">Projects</a>
    <a href="index.html#education">Education</a>
    <a href="index.html#certifications">Certs</a>
  </div>
</nav>
 
<header class="contact-hero">
  <div class="hero-tag">Let's Connect</div>
  <h1 class="name">GET IN<br><span>TOUCH</span></h1>
  <div class="contact-info">
    <a href="mailto:sbsaetang@gmail.com"><span class="ico">✉</span> sbsaetang@gmail.com</a>
    <a href="tel:4048245465"><span class="ico">✆</span> (404) 824-5465</a>
    <a href="https://github.com/SSaetang23" target="_blank"><span class="ico">⌥</span> SSaetang23</a>
    <a href="https://www.linkedin.com/in/shaun-saetang-7456611b7/" target="_blank"><span class="ico">in</span> LinkedIn</a>
  </div>
</header>
 
<main class="contact-main">
  <div class="sec-label">Send a Message</div>
  <form action="https://formsubmit.co/d4adcbc3e92f9e6910d7e4c9b4051bde" method="post" class="form-grid">
    <input type="hidden" name="_next" value="thankyou.html">
    <input type="hidden" name="_subject" value="New message from CV contact form">
 
    <div class="form-row">
      <div class="form-field">
        <label class="form-label" for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>
      </div>
      <div class="form-field">
        <label class="form-label" for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="your@email.com" required>
      </div>
    </div>
 
    <div class="form-field">
      <label class="form-label" for="message">Message</label>
      <textarea id="message" name="message" rows="10" placeholder="What's on your mind?" required></textarea>
    </div>
 
    <div>
      <button type="submit" class="form-submit">Send Message →</button>
    </div>
  </form>
</main>
 
<footer>
  <span id="yr"></span> &nbsp;·&nbsp;
  <a href="index.html">Shaun Saetang</a> &nbsp;·&nbsp;
  <a href="https://www.linkedin.com/in/shaun-saetang-7456611b7/" target="_blank">LinkedIn</a> &nbsp;·&nbsp;
  <a href="https://github.com/SSaetang23" target="_blank">GitHub</a>
</footer>
 
</div>
<script>document.getElementById("yr").textContent = new Date().getFullYear();</script>
</body>
</html>
